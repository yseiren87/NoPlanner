syntax = "proto3";

package noplanner.user.v1;

import "common/v1/status.proto";
import "google/protobuf/timestamp.proto";

option go_package = "noplanner/backend/proto/dist/golang/user/v1;userv1";

service UserService {
  rpc GetStatus(noplanner.common.v1.StatusRequest) returns (noplanner.common.v1.StatusResponse);
  rpc BeginGoogleLogin(BeginGoogleLoginRequest) returns (BeginGoogleLoginResponse);
  rpc CompleteGoogleLogin(CompleteGoogleLoginRequest) returns (CompleteGoogleLoginResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}

message BeginGoogleLoginRequest {}

message BeginGoogleLoginResponse {
  string authorization_url = 1;
}

message CompleteGoogleLoginRequest {
  string code = 1;
  string state = 2;
}

message CompleteGoogleLoginResponse {
  GoogleUser user = 1;
  string access_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  string subject = 1;
}

message GoogleUser {
  string subject = 1;
  string email = 2;
  string name = 3;
  string picture_url = 4;
}

syntax = "proto3";

package noplanner.common.v1;

option go_package = "noplanner/backend/proto/dist/golang/common/v1;commonv1";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 6;
  ERROR_CODE_CONFIGURATION_REQUIRED = 7;
  ERROR_CODE_RATE_LIMITED = 8;
  ERROR_CODE_INTERNAL = 9;
}

message ErrorDetail {
  ErrorCode code = 1;
  string request_id = 2;
  string evaluation_id = 3;
  bool retryable = 4;
}
